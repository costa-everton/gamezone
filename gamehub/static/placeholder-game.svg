<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14ffec;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Game Controller Icon -->
  <g transform="translate(150, 100)">
    <!-- Controller Body -->
    <rect x="0" y="20" width="100" height="60" rx="10" fill="#ffffff" opacity="0.9"/>
    
    <!-- Left Stick -->
    <circle cx="25" cy="50" r="15" fill="#00b3ff"/>
    <circle cx="25" cy="50" r="8" fill="#ffffff"/>
    
    <!-- Right Stick -->
    <circle cx="75" cy="50" r="15" fill="#14ffec"/>
    <circle cx="75" cy="50" r="8" fill="#ffffff"/>
    
    <!-- Buttons -->
    <circle cx="50" cy="30" r="6" fill="#ff6b6b"/>
    <circle cx="50" cy="70" r="6" fill="#4ecdc4"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="200" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    GameHub
  </text>
  <text x="200" y="230" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" opacity="0.8">
    Carregando jogo...
  </text>
</svg>
